<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Aymen Jallouli — Software Engineer and Full-Stack Developer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38B2AC"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38B2AC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="glow" x1="0.15" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38B2AC" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#4F46E5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#18233A" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ── base ── -->
  <rect width="1200" height="330" rx="18" fill="#0B1120"/>
  <rect width="1200" height="330" rx="18" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="330" rx="18" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="328.5" rx="17.5" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- ── left accent rail ── -->
  <rect x="0" y="70" width="5" height="190" rx="2.5" fill="url(#accent)"/>

  <!-- ══ right visual: application interface ══ -->

  <!-- back card (depth) -->
  <rect x="906" y="62" width="252" height="168" rx="12" fill="#0F182B" stroke="#1B2740" stroke-width="1.5" opacity="0.75"/>

  <!-- main window -->
  <g>
    <rect x="880" y="86" width="252" height="172" rx="12" fill="#111C33" stroke="#26344F" stroke-width="1.5"/>
    <path d="M880 98a12 12 0 0 1 12-12h228a12 12 0 0 1 12 12v22H880z" fill="#0E1729"/>
    <line x1="880" y1="120" x2="1132" y2="120" stroke="#26344F" stroke-width="1.5"/>
    <circle cx="898" cy="103" r="4" fill="#334155"/>
    <circle cx="912" cy="103" r="4" fill="#334155"/>
    <circle cx="926" cy="103" r="4" fill="#334155"/>
    <rect x="944" y="98" width="120" height="10" rx="5" fill="#1B2740"/>

    <!-- sidebar -->
    <rect x="894" y="134" width="52" height="110" rx="7" fill="#4F46E5" opacity="0.16"/>
    <rect x="902" y="146" width="36" height="6" rx="3" fill="#38B2AC" opacity="0.75"/>
    <rect x="902" y="162" width="28" height="6" rx="3" fill="#334155"/>
    <rect x="902" y="178" width="32" height="6" rx="3" fill="#334155"/>
    <rect x="902" y="194" width="24" height="6" rx="3" fill="#334155"/>

    <!-- hero block -->
    <rect x="960" y="134" width="158" height="42" rx="7" fill="url(#accentSoft)"/>

    <!-- content rows -->
    <rect x="960" y="188" width="74" height="56" rx="7" fill="#16233C"/>
    <rect x="970" y="200" width="42" height="6" rx="3" fill="#38B2AC" opacity="0.6"/>
    <rect x="970" y="214" width="54" height="5" rx="2.5" fill="#2A3A57"/>
    <rect x="970" y="226" width="34" height="5" rx="2.5" fill="#2A3A57"/>

    <rect x="1044" y="188" width="74" height="56" rx="7" fill="#16233C"/>
    <rect x="1054" y="200" width="42" height="6" rx="3" fill="#4F46E5" opacity="0.7"/>
    <rect x="1054" y="214" width="54" height="5" rx="2.5" fill="#2A3A57"/>
    <rect x="1054" y="226" width="34" height="5" rx="2.5" fill="#2A3A57"/>
  </g>

  <!-- floating mobile viewport -->
  <g>
    <rect x="1096" y="196" width="62" height="98" rx="11" fill="#0E1729" stroke="#38B2AC" stroke-width="1.5"/>
    <rect x="1116" y="204" width="22" height="4" rx="2" fill="#26344F"/>
    <rect x="1106" y="220" width="42" height="18" rx="4" fill="url(#accentSoft)"/>
    <rect x="1106" y="246" width="42" height="5" rx="2.5" fill="#2A3A57"/>
    <rect x="1106" y="257" width="30" height="5" rx="2.5" fill="#2A3A57"/>
    <rect x="1106" y="272" width="42" height="12" rx="4" fill="#38B2AC" opacity="0.35"/>
  </g>

  <!-- ══ text block ══ -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">

    <text x="58" y="102" font-size="14.5" font-weight="600" letter-spacing="4.6" fill="#38B2AC">
      SOFTWARE ENGINEER &#183; FULL-STACK DEVELOPER
    </text>

    <text x="55" y="182" font-size="62" font-weight="700" letter-spacing="-1" fill="#F1F5F9">
      Aymen Jallouli
    </text>

    <rect x="58" y="206" width="86" height="4" rx="2" fill="url(#accent)"/>

    <text x="58" y="246" font-size="19" fill="#94A3B8">
      I design, build, and ship web applications end to end.
    </text>

    <!-- domain chip -->
    <rect x="56" y="268" width="206" height="34" rx="17" fill="#111C33" stroke="#334155" stroke-width="1"/>
    <circle cx="78" cy="285" r="4.5" fill="#38B2AC"/>
    <text x="94" y="291" font-size="14.5" font-weight="600" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" fill="#CBD5E1">
      aymenjallouli.dev
    </text>

    <!-- availability chip -->
    <rect x="274" y="268" width="228" height="34" rx="17" fill="#0F1E1C" stroke="#1F4B47" stroke-width="1"/>
    <circle cx="296" cy="285" r="4.5" fill="#22C55E"/>
    <text x="312" y="291" font-size="14.5" font-weight="600" fill="#86EFAC">
      Available for freelance work
    </text>

  </g>
</svg>
